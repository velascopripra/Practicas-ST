# Escuchar conexiones FTP en IPv4
listen=YES

# No escuchar en IPv6
listen_ipv6=NO

# Desactivar acceso anónimo (requiere usuario/password)
anonymous_enable=NO

# Permitir inicio de sesión de usuarios locales del sistema
local_enable=YES

# Permitir escritura (subir, borrar, modificar archivos)
write_enable=YES

# ======================
# TLS/SSL - Conexiones seguras
# ======================

# Habilitar TLS/SSL para conexiones FTP seguras (FTPS)
ssl_enable=YES

# No permitir SSL a usuarios anónimos (aunque estuvieran habilitados)
allow_anon_ssl=NO

# Obligar a que la transferencia de datos esté cifrada
force_local_data_ssl=YES

# Obligar a que el inicio de sesión esté cifrado
force_local_logins_ssl=YES

# Permitir solo TLSv1 o superior
ssl_tlsv1=YES

# Desactivar protocolos inseguros
ssl_sslv2=NO
ssl_sslv3=NO

# Ruta del certificado SSL usado por vsftpd
rsa_cert_file=/etc/ssl/private/vsftpd.pem

# ======================
# Configuración de modo pasivo
# ======================

# Activar modo pasivo (necesario si hay firewall/NAT)
pasv_enable=YES

# Rango de puertos pasivos usados para las conexiones de datos
pasv_min_port=30000
pasv_max_port=31000

# Dirección IP que el servidor enviará al cliente para conectarse en modo pasivo
# (Debe ser la IP pública o del firewall si está detrás de uno)
pasv_address=192.168.50.3
